<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 038</title>
  <desc>Understand the photograph&#x27;s unspoken relation and rebuild only its essential forms as a warm contemporary patchwork collage made from checks, linen, washed burlap, cut cloth, frayed edges, patches, and visible hand stitching.</desc>
  <defs><clipPath id="f"><rect width="1200" height="400" rx="30"/></clipPath><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter></defs>
