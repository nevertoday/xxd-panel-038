    <rect width="1200" height="400" fill="#F5F0E7"/><circle cx="1080" cy="38" r="180" fill="#FFFFFF" fill-opacity=".34"/><circle cx="760" cy="390" r="200" fill="#5D8D83" fill-opacity=".1"/>
    <g transform="translate(58 42)"><rect width="224" height="34" rx="8" fill="#172D31"/><text x="16" y="22" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="2">🦁 XXD / IMAGE SKILL</text><text y="112" fill="#172D31" font-family="Arial,sans-serif" font-size="68" font-weight="900" letter-spacing="-3">PANEL <tspan fill="#D96952">038</tspan></text><text x="2" y="151" fill="#5D8D83" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing=".32">SOURCE FABRIC · FRAYED EDGE · HAND STITCH · ACTIVE WHITESPACE · HIDDEN FEELING</text><text x="2" y="198" fill="#172D31" font-family="sans-serif" font-size="18" font-weight="800">把照片重新缝成一段温暖的人文拼布故事</text><text x="2" y="230" fill="#3B555A" font-family="sans-serif" font-size="14" font-weight="700">写真を、温かな人文的パッチワーク物語へ縫い直す</text><text x="2" y="260" fill="#3B555A" font-family="sans-serif" font-size="14" font-weight="700">사진을 따뜻한 휴머니스트 패치워크 이야기로 다시 꿰매기</text><text x="2" y="291" fill="#3B555A" font-family="Arial,sans-serif" font-size="13" font-weight="700">إعادة خياطة الصورة كحكاية إنسانية دافئة من الرقع</text></g>
    <g transform="translate(58 334)"><rect width="105" height="34" rx="8" fill="#172D31"/><text x="52.5" y="22" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="900">SOURCE-BOUND</text><rect x="117" width="88" height="34" rx="8" fill="#D96952"/><text x="161" y="22" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="900">4 MODES</text><rect x="217" width="132" height="34" rx="8" fill="#5D8D83"/><text x="283" y="22" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="900">WALLPAPER PACK</text></g>
